<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Performance: open the connections to Supabase and Firebase's push
      services as soon as the page loads, instead of paying that ~1-time
      connection-setup cost when the user clicks "Enable notifications."
      %VITE_SUPABASE_URL% is replaced at build time by Vite with the real
      value from the VITE_SUPABASE_URL env var/secret — same mechanism
      already used for the other VITE_ variables in this project.
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://firebaseinstallations.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fcmregistrations.googleapis.com" crossorigin />

    <!--
      Prevent the browser from HTTP-caching this file.
      After a Vite build, asset filenames change (content hashes). If the
      browser serves a stale index.html it requests old hashed filenames
      that no longer exist on the server → 404 → blank page on desktop.
      no-store forces a network fetch every time, which is correct for an
      app shell whose only real content is a <script> tag.
    -->
    <meta http-equiv="Cache-Control" content="no-store" />

    <!-- Critical for mobile display -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Theme color (browser chrome color on Android) -->
    <meta name="theme-color" content="#FAFAF9" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Capsula" />
    <!--
      Phase F6 Stage 2: these four links used to hardcode the '/capsula/'
      GitHub Pages path prefix directly. That prefix doesn't exist on the
      Capacitor (native) build — same bug class as the logo path fixed in
      Stage 1, just not yet noticed here since these are small icons, not
      the visible logo. %BASE_URL% is Vite's own built-in placeholder for
      this exact situation: it's replaced at build time with whatever
      `base` is set to in vite.config.js ('/capsula/' for the website,
      '/' for native), so these now resolve correctly on both builds
      automatically, the same way import.meta.env.BASE_URL already does
      for JS-side references. Vite's base value always ends in a trailing
      slash, so no leading slash is added after %BASE_URL% below.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />

    <title>Capsula</title>

    <!--
      GitHub Pages SPA redirect — decode script.
      Companion to public/404.html.
      Runs before React boots: reads sessionStorage set by 404.html,
      restores the original path via history.replaceState so React Router
      sees the correct URL on mount.

      Phase F6 Stage 2 note: left unguarded deliberately. This only ever
      does anything if the 'gh_pages_redirect' sessionStorage key is
      present — and that key is only ever set by public/404.html, a
      GitHub Pages-only mechanism that native never triggers (native has
      no server-side 404 routing; local bundled files are always found
      directly). It's already inert on native without needing a check.
    -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('gh_pages_redirect');
        if (redirect) {
          sessionStorage.removeItem('gh_pages_redirect');
          try {
            var data = JSON.parse(redirect);
            var url = window.location.protocol + '//' + window.location.host +
                      '/capsula' + data.path +
                      (data.query ? '?' + data.query : '') +
                      (data.hash  ? '#' + data.hash  : '');
            window.history.replaceState(null, null, url);
          } catch(e) {}
        }
      })();
    </script>

    <!--
      Blank-on-deploy mitigation (GH Pages CDN propagation race).

      During the ~10 min a new deploy takes to fully propagate across
      GitHub Pages' CDN edges, a fresh navigation (e.g. opening /admin,
      which always re-runs the 404.html redirect chain — unlike the main
      app, which is usually already open) can land on an edge node still
      serving a mismatched index.html / asset-bundle pairing. The bundle
      404s, React never mounts, and #root stays empty with no feedback.

      This can't be prevented from here (it's GH Pages' own propagation
      delay), but it can be made to self-heal: if the main module script
      fails to load, retry with a cache-busted URL a few times before
      giving up with a visible reload link instead of a silent blank page.
      The retry counter is cleared in main.jsx once the module actually
      starts executing, so this only ever fires on a genuine load failure.

      Phase F6 Stage 2: guarded to skip entirely on native. The CDN
      propagation delay this exists for can't happen on native — assets
      are bundled locally at build time, not served from a rolling-out
      CDN. If a native module load ever genuinely failed (a corrupted
      local bundle), reloading wouldn't fix it anyway (the same broken
      files would still be there), and the hardcoded '/capsula/' reload
      path below would be wrong for native's unprefixed root regardless.
      window.Capacitor is injected by Capacitor's native bridge before
      any page script runs, so it's reliably available here without an
      import.
    -->
    <script>
      window.__mainLoadFailed = function () {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          return;
        }
        var key = 'capsula_boot_retry_count';
        var n = parseInt(sessionStorage.getItem(key) || '0', 10);
        if (n >= 3) {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML =
              '<div style="padding:48px 24px;text-align:center;font-family:system-ui,sans-serif;color:#57534E">' +
              '<p style="margin-bottom:16px;">Capsula is finishing an update — this is taking longer than usual.</p>' +
              '<a href="/capsula/" style="color:#0F766E;font-weight:600;text-decoration:underline;">Tap here to reload</a>' +
              '</div>';
          }
          return;
        }
        sessionStorage.setItem(key, String(n + 1));
        setTimeout(function () {
          window.location.replace('/capsula/?boot-retry=' + Date.now());
        }, 2500);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" onerror="window.__mainLoadFailed()"></script>
  </body>
</html>
