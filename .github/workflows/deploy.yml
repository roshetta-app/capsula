name: Publish old-address forwarder (GitHub Pages)
# S3.4b. The app no longer lives on GitHub Pages (it is built and uploaded by "Deploy Capsula to
# Cloudflare Pages"). This workflow only publishes the three small files in forwarder/ so that old
# links and installed old copies move to https://capsula-app.pages.dev. It needs no build and no
# app secrets, and it runs only when those files change (or by hand: "Run workflow").
# To undo the whole move: revert the S3.4b commit; this file then builds the app again.
on:
  push:
    branches: [main]
    paths:
      - 'forwarder/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/forwarder.check.mjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks for the forwarder
        run: node --test scripts/forwarder.check.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: forwarder
      # GitHub sometimes cannot find the uploaded site for a few seconds ("Found 0 artifact(s)").
      # The first try is allowed to fail; if it does, wait and try once more.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
