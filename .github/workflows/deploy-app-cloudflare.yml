name: Deploy Capsula to Cloudflare Pages
# S3.2. Builds the website for a host at the ROOT address (no /capsula/ prefix) and uploads it to the
# free Cloudflare Pages project below. Also by hand ("Run workflow"). From S3.4a it runs on every push
# to main, so this address is the official one and always current. Since S3.4b the old GitHub Pages
# site (deploy.yml) only forwards old links here and builds nothing. After the upload it reads the new
# address back and checks it (deep links, install file, worker file, headers).
# Uses the same two Cloudflare secrets as the catalog workflow; the app's own secrets stay in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PROJECT: capsula-app
      APP_HOST: https://capsula-app.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # LR2.3 (2026-11-28): run EVERY automatic check (all *.check.js / *.check.mjs files) before
      # anything is built or published. A red check stops this job, so nothing reaches the live site.
      - name: All checks (red means stop)
        run: npm run check:all
      - name: Inject build SHA into service worker
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          sed -i "s/__BUILD_SHA__/${SHORT_SHA}/g" public/sw.js
      - name: Build for the root address
        run: npm run build
        env:
          SITE_BASE: /
          VITE_PUBLIC_SITE: ${{ env.APP_HOST }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
      - name: Drop 404.html and add the headers file
        run: node scripts/app-publish.mjs prepare dist
      - name: Create the Pages project if it does not exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -q "$APP_PROJECT"; then
            echo "Project $APP_PROJECT already exists"
          else
            npx --yes wrangler@4 pages project create "$APP_PROJECT" --production-branch main
          fi
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$APP_PROJECT" --branch main --commit-dirty=true
      - name: Read the live site back and check it
        run: node scripts/app-publish.mjs verify
